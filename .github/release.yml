# Changelog categories for every Craft workspace in `.craft.yml`.
#
# A custom file replaces Craft's defaults entirely. It groups entries by change
# type, strips the `type(scope):` prefix, and catches every remaining change so
# it still counts toward the version bump.
changelog:
  exclude:
    labels:
      - skip-changelog
    # Release commits. Releasing one workspace can touch files of another
    # (e.g. the Rust client bumps `objectstore-types`, which the server
    # includes), so they would otherwise show up in that changelog.
    authors:
      - getsentry-bot
  categories:
    - title: Breaking Changes
      commit_patterns:
        - "^(?<type>\\w+(?:\\([^)]+\\))?!:\\s*)"
      semver: major
    - title: New Features
      commit_patterns:
        - "^(?<type>feat(?:\\([^)]+\\))?:\\s*)"
      semver: minor
    - title: Bug Fixes
      commit_patterns:
        - "^(?<type>fix(?:\\([^)]+\\))?:\\s*)"
      semver: patch
    # Catch-all: any other conventional type, then any other title.
    - title: Other Changes
      commit_patterns:
        - "^(?<type>\\w+(?:\\([^)]+\\))?:\\s*)"
        - ".*"
      semver: patch
