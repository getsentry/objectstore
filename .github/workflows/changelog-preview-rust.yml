name: Changelog Preview (Rust client)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths:
      - clients/rust/**

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@924b450ede4af30e30de4821a4b357d676c8df92 # v3
    with:
      working-directory: clients/rust
      # Report as a check with a job summary. In comment mode, both client
      # previews would overwrite the same PR comment.
      comment: false
