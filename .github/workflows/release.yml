name: Release

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Craft workspace to release
        required: true
        type: choice
        options:
          - clients/python
          - clients/rust
          - objectstore-server
      version:
        description: Exact version, bump type (major, minor, patch), or auto. Leave blank for auto (clients) or CalVer (server)
        required: false
      force:
        description: Force a release even when there are release-blockers (optional)
        required: false
      merge_target:
        description: Target branch to merge into. Uses the default branch as a fallback (optional)
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        id: token
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3

      - name: Prepare release
        uses: getsentry/craft@4b763f5419255bb520e3e5a49f5b91426dcd374d # 3.3.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          workspace: ${{ inputs.workspace }}
          version: ${{ inputs.version }}
          force: ${{ inputs.force }}
          merge_target: ${{ inputs.merge_target }}
          git_user_name: getsentry-bot
          git_user_email: bot@sentry.io
