name: Changelog Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# A called workflow can't get more permissions than its caller, and Craft's
# preview job requests all three, so dropping any of them fails the run at
# startup.
permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    # Posts one comment listing every workspace in `.craft.yml` whose
    # changelog lists this PR, with its bump.
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@4a8dba2a45b09f4e3fcfc86a79c94d0dd93295bb # 3.4.0
    with:
      craft-version: 3.4.0
