name: Changelog Preview

# Comments on the PR with the changelogs it will be listed in, one per Craft
# workspace in `.craft.yml`, and the entry it adds to them.
#
# SECURITY: `pull_request_target` runs with a write token. Only the base
# branch is checked out; the PR's code is never fetched. Its changed paths come
# from the GitHub API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: changelog-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Craft
        env:
          GH_TOKEN: ${{ github.token }}
          CRAFT_VERSION: 3.3.0
        run: |
          gh release download "$CRAFT_VERSION" --repo getsentry/craft --pattern craft --dir "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/craft" /usr/local/bin/craft

      - name: Comment changelog preview
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CRAFT_LOG_LEVEL: Warn
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_AUTHOR_NAME: changelog-preview
          GIT_AUTHOR_EMAIL: changelog-preview@localhost
          GIT_COMMITTER_NAME: changelog-preview
          GIT_COMMITTER_EMAIL: changelog-preview@localhost
        run: |
          set -euo pipefail

          # Craft decides which workspaces a commit belongs to from the paths it
          # changes. Build one commit on top of the base branch that changes the
          # same paths as the PR (with placeholder content), and ask each
          # workspace whether that commit is in it. `reset --soft` moves HEAD to
          # it but keeps the base branch's files, which Craft reads its
          # configuration from.
          base=$(git rev-parse HEAD)
          placeholder=$(git hash-object -w --stdin <<< "changelog preview")
          export GIT_INDEX_FILE="$RUNNER_TEMP/changelog-preview-index"
          git read-tree "$base"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            | jq -j --arg blob "$placeholder" '.[]
                | (if .previous_filename then "0 \("0" * 40)\t\(.previous_filename)\u0000" else "" end)
                + (if .status == "removed" then "0 \("0" * 40)" else "100644 \($blob)" end)
                + "\t\(.filename)\u0000"' \
            | git update-index -z --index-info
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          git reset --quiet --soft "$(git commit-tree "$tree" -p "$base" -m "#$PR_NUMBER")"

          touched=()
          impacts=()
          entry=""
          skipped=false
          for workspace in $(craft workspace list | jq -r '.[]'); do
            commits=$(CRAFT_WORKSPACE="$workspace" craft changelog --since "$base" --format json | jq '.totalCommits')
            if [[ "$commits" == 0 ]]; then
              continue
            fi

            result=$(CRAFT_WORKSPACE="$workspace" craft changelog --pr "$PR_NUMBER" --format json)
            skipped=$(jq -r '.prSkipped' <<< "$result")
            if [[ "$(jq -r '.versioningPolicy' <<< "$result")" == calver ]]; then
              impact="CalVer"
            else
              case "$(jq -r '.bumpType' <<< "$result")" in
                major) impact="🔴 Major" ;;
                minor) impact="🟡 Minor" ;;
                patch) impact="🟢 Patch" ;;
                *) impact="⚪ None" ;;
              esac
            fi
            touched+=("\`$workspace\`")
            impacts+=("- \`$workspace\`: $impact")

            # The entry is the same in every changelog. Craft quotes this PR's
            # lines in the full preview; keep them and their section heading.
            if [[ -z "$entry" ]]; then
              entry=$(jq -r '.changelog' <<< "$result" | awk '
                /^#+ / { heading = $0; printed = 0; next }
                /^>/ {
                  if (!printed && heading != "") { print heading "\n"; printed = 1 }
                  sub(/^> ?/, ""); print
                }')
            fi
          done

          marker="<!-- objectstore-changelog-preview -->"
          if [[ ${#touched[@]} -eq 0 ]]; then
            summary="This PR doesn't change any released workspace, so it won't be listed in any changelog."
          elif [[ "$skipped" == true ]]; then
            summary="This PR is excluded from the changelogs of the workspaces it changes (\`skip-changelog\`): ${touched[*]}"
          else
            summary="This PR will be listed in the changelogs of:"$'\n\n'"$(printf '%s\n' "${impacts[@]}")"$'\n\n'"$entry"
          fi
          body="$marker"$'\n'"## Changelog Preview"$'\n\n'"$summary"

          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          elif [[ ${#touched[@]} -gt 0 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
