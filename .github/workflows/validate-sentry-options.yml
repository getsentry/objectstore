name: Validate sentry-options schema

on:
  pull_request:
    paths:
      - 'sentry-options/schemas/**'

permissions:
  contents: read

jobs:
  validate:
    uses: getsentry/sentry-options/.github/workflows/validate-schema.yml@72d9dcba2e883cdb394302d8c0a686d0a516c2eb
    secrets:
      SENTRY_READONLYBOT_PRIVATE_KEY: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
    with:
      schemas-path: sentry-options/schemas
