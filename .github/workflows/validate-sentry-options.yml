name: Validate sentry-options schema

on:
  pull_request:
    paths:
      - 'sentry-options/schemas/**'

permissions:
  contents: read

jobs:
  validate:
    uses: getsentry/sentry-options/.github/workflows/validate-schema.yml@e2766cbc2feca445d5c52ce61d111d97834d7ae1
    secrets:
      SENTRY_READONLYBOT_PRIVATE_KEY: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
    with:
      schemas-path: sentry-options/schemas
