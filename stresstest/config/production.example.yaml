# Replays the object sizes of the production usecases.
#
# The `buckets` of each workload approximate the cumulative size histogram of
# `objectstore.put.size` in Datadog. The counts are rounded and scaled to one
# million objects, so they are close to production but are not the real data.
# See "Size buckets" in the README for their meaning and for how to pull the
# real histogram of a usecase.

remote: http://localhost:18888

duration: 5s

workloads:
  # The write rates roughly follow the ratio between usecases, rounded. The last
  # four usecases see far fewer writes than this and are set to the minimum rate.
  - name: attachments
    mode: fixed-rate
    organizations: 1000
    actions:
      writes: 100
      reads: 0
      deletes: 0
    file_sizes:
      buckets:
        64 B: 16000
        128 B: 32000
        256 B: 73000
        512 B: 150000
        1 KiB: 240000
        2 KiB: 350000
        4 KiB: 460000
        8 KiB: 560000
        16 KiB: 630000
        32 KiB: 700000
        64 KiB: 800000
        128 KiB: 900000
        256 KiB: 948000
        512 KiB: 977000
        1 MiB: 990000
        2 MiB: 995400
        4 MiB: 997000
        8 MiB: 998500
        16 MiB: 999310
        32 MiB: 999890
        64 MiB: 999956
        128 MiB: 999990
        256 MiB: 999998
        512 MiB: 999999
        1 GiB: 1000000
