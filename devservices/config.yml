# Ignored by docker compose, used by devservices
x-sentry-service-config:
  version: 0.1
  service_name: objectstore
  dependencies:
    objectstore:
      description: Objectstore server
    bigtable:
      description: Google Cloud BigTable emulator
    cassandra:
      description: Apache Cassandra
    gcs:
      description: Google Cloud Storage emulator
    seaweedfs:
      description: SeaweedFS S3 server
  modes:
    default: []
    containerized: [objectstore]
    full: [bigtable, cassandra, gcs, seaweedfs]

x-programs:
  devserver:
    command: cargo run --

services:
  objectstore:
    image: ghcr.io/getsentry/objectstore:nightly
    environment:
      OS__STORAGE__TYPE: "filesystem"
      OS__STORAGE__PATH: "/data"
      OS__LOGGING__LEVEL: "debug"
      OS__AUTH__ENFORCE: "false"
    command: run
    healthcheck:
      test: ["CMD", "/bin/entrypoint", "healthcheck"]
      interval: 5s
      timeout: 1s
      retries: 5
    ports:
      - 127.0.0.1:8888:8888
    volumes:
      - objectstore-data:/data
    networks:
      - devservices
    labels:
      - orchestrator=devservices
    restart: unless-stopped
  bigtable:
    image: ghcr.io/getsentry/image-mirror-google-cloud-sdk:588.0.0
    command: /run-bigtable.sh
    environment:
      BIGTABLE_EMULATOR_HOST: localhost:8086
    healthcheck:
      test: cbt -project testing -instance objectstore count objectstore
      interval: 5s
      timeout: 1s
      retries: 5
    ports:
      - 127.0.0.1:8086:8086
    volumes:
      - ./run-bigtable.sh:/run-bigtable.sh
    networks:
      - devservices
    labels:
      - orchestrator=devservices
    restart: unless-stopped
  cassandra:
    image: cassandra:5.0.9
    command: /run-cassandra.sh
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      # Clients connect through the port mapping, so advertise the host's address.
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
    healthcheck:
      test: cqlsh -e "describe table objectstore.objectstore"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - 127.0.0.1:8088:9042
    volumes:
      - ./run-cassandra.sh:/run-cassandra.sh
      - ./cql-schema.cql:/cql-schema.cql
    networks:
      - devservices
    labels:
      - orchestrator=devservices
    restart: unless-stopped
  gcs:
    build: https://github.com/getsentry/google-cloud-storage-testbench.git#main
    environment:
      GOOGLE_CLOUD_CPP_STORAGE_TEST_BUCKET_NAME: test-bucket
    healthcheck:
      test: curl -f http://localhost:9000
      interval: 5s
      timeout: 1s
      retries: 5
    ports:
      - 127.0.0.1:8087:9000
    networks:
      - devservices
    labels:
      - orchestrator=devservices
    restart: unless-stopped
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_BUCKET: test-bucket
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8333/test-bucket"]
      interval: 5s
      timeout: 1s
      retries: 12
    ports:
      - 127.0.0.1:8089:8333
    networks:
      - devservices
    labels:
      - orchestrator=devservices
    restart: unless-stopped

networks:
  devservices:
    name: devservices
    external: true

volumes:
  objectstore-data:
