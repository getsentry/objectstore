[package]
name = "objectstore-client"
authors = ["Sentry <oss@sentry.io>"]
description = "Client SDK for Objectstore, the Sentry object storage platform"
homepage = "https://getsentry.github.io/objectstore/"
repository = "https://github.com/getsentry/objectstore"
license-file = "../../LICENSE.md"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
publish = true

[package.metadata.docs.rs]
features = ["resumable-upload-api"]

[dependencies]
async-compression = { workspace = true, features = ["gzip", "tokio", "zstd"] }
bytes = { workspace = true }
futures-util = { workspace = true }
infer = { workspace = true }
jsonwebtoken = { workspace = true }
multer = { workspace = true }
objectstore-types = { workspace = true }
rand = { workspace = true }
# Pinned below workspace version for MSRV compatibility
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "http2", "system-proxy", "json", "stream", "multipart", "query"] }
sentry-core = { version = ">=0.41", default-features = false, features = ["client"] }
serde = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.45.0", default-features = false, features = ["fs", "io-util", "rt", "time"] }
tokio-util = { workspace = true, features = ["io"] }
url = { workspace = true }
zstd-safe = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
objectstore-test = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
zstd = { workspace = true }

[features]
default = ["native-tls", "hickory-dns"]
resumable-upload-api = []

rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
hickory-dns = ["reqwest/hickory-dns"]
