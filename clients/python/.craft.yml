changelog:
  policy: auto
  # Categories in `.github/release.yml` group entries by change type.
  scopeGrouping: false
preReleaseCommand: ../../scripts/bump-version-py-client.sh
releaseBranchPrefix: release-library/py-client

targets:
  - name: github
    tagPrefix: py-client@
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi

requireNames:
  - /.*objectstore_client.*whl$/
  - /.*objectstore_client.*tar\.gz$/
