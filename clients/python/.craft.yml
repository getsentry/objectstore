changelog:
  policy: auto
  # Group entries only by the categories in `.github/release.yml`.
  scopeGrouping: false
preReleaseCommand: ../../scripts/bump-version-py-client.sh
releaseBranchPrefix: release-py

targets:
  - name: github
    tagPrefix: py-client@
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi

requireNames:
  - /.*objectstore_client.*whl$/
  - /.*objectstore_client.*tar\.gz$/
