# Changelog categories for the client releases. Craft reads `.github/release.yml`
# next to each client's `.craft.yml`, so `clients/python/.github/release.yml` and
# `clients/rust/.github/release.yml` are symlinks to this file.
#
# Each client has its own release and changelog, so entries are grouped by
# change type. The `type(scope):` prefix is stripped from titles. Entries are
# matched top to bottom; categories that share a title render as one section,
# and `semver` drives the version bump.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes 🛠
      commit_patterns:
        - "^(?<type>\\w+(?:\\([^)]+\\))?!:\\s*)"
      semver: major
    - title: Security 🔒
      commit_patterns:
        - "^(?<type>security(?:\\([^)]+\\))?:\\s*)"
      semver: patch
    - title: New Features ✨
      commit_patterns:
        - "^(?<type>feat(?:\\([^)]+\\))?:\\s*)"
      semver: minor
    - title: Bug Fixes 🐛
      commit_patterns:
        - "^(?<type>fix(?:\\([^)]+\\))?:\\s*)"
        - '^Revert "'
      semver: patch
    - title: Documentation 📚
      commit_patterns:
        - "^(?<type>docs?(?:\\([^)]+\\))?:\\s*)"
      semver: patch
    # Catch-all, so every change to a client lands in its changelog and bumps
    # the version: any other type, then titles that aren't conventional at all.
    - title: Internal Changes 🔧
      commit_patterns:
        - "^(?<type>\\w+(?:\\([^)]+\\))?:\\s*)"
      semver: patch
    - title: Internal Changes 🔧
      labels:
        - "*"
      semver: patch
