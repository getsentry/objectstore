# Changelog categories for client releases, read by Craft from `clients/`.
#
# PR titles must use the `py-client` or `rs-client` scope to be listed, e.g.
# `feat(py-client): Add X`. Entries are matched top to bottom; categories that
# share a title render as one section, and `semver` drives the version bump.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Python Client
      commit_patterns:
        - "^(?<type>\\w+\\(py-client\\)!:\\s*)"
      semver: major
    - title: Rust Client
      commit_patterns:
        - "^(?<type>\\w+\\(rs-client\\)!:\\s*)"
      semver: major
    - title: Python Client
      commit_patterns:
        - "^(?<type>feat\\(py-client\\):\\s*)"
      semver: minor
    - title: Rust Client
      commit_patterns:
        - "^(?<type>feat\\(rs-client\\):\\s*)"
      semver: minor
    - title: Python Client
      commit_patterns:
        - "^(?<type>\\w+\\(py-client\\):\\s*)"
      semver: patch
    - title: Rust Client
      commit_patterns:
        - "^(?<type>\\w+\\(rs-client\\):\\s*)"
      semver: patch
