# Changelog categories for both client releases. Craft reads `.github/release.yml`
# next to each `.craft.yml`, so `clients/{python,rust}/.github/release.yml` are
# symlinks to this file.
#
# A custom file replaces Craft's defaults entirely. Compared to them, it strips
# the `type(scope):` prefix from entries and catches every remaining change so
# it still counts toward the version bump.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes 🛠
      commit_patterns:
        - "^(?<type>\\w+(?:\\([^)]+\\))?!:\\s*)"
      semver: major
    - title: New Features ✨
      commit_patterns:
        - "^(?<type>feat(?:\\([^)]+\\))?:\\s*)"
      semver: minor
    - title: Bug Fixes 🐛
      commit_patterns:
        - "^(?<type>fix(?:\\([^)]+\\))?:\\s*)"
      semver: patch
    # Catch-all: any other conventional type, then any other title.
    - title: Other Changes 🔧
      commit_patterns:
        - "^(?<type>\\w+(?:\\([^)]+\\))?:\\s*)"
      semver: patch
    - title: Other Changes 🔧
      labels:
        - "*"
      semver: patch
