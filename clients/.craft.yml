changelog:
  policy: auto
  # Categories in `.github/release.yml` are the per-client headings; no scope subheadings.
  scopeGrouping: false
preReleaseCommand: ../scripts/bump-version-clients.sh
releaseBranchPrefix: release-library

targets:
  - name: github
  - name: crates
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi

requireNames:
  - /.*objectstore_client.*whl$/
  - /.*objectstore_client.*tar\.gz$/
